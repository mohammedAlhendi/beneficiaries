{% if page.paginator.num_pages > 1 %}
<nav class="pager no-print" aria-label="التنقل بين الصفحات">
  {% if page.has_previous %}<a href="?{{ qs }}{% if qs %}&{% endif %}page={{ page.previous_page_number }}" rel="prev">&rarr; السابق</a>{% endif %}
  <span class="cur">{{ page.number }} / {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="?{{ qs }}{% if qs %}&{% endif %}page={{ page.next_page_number }}" rel="next">التالي &larr;</a>{% endif %}
</nav>
{% endif %}
